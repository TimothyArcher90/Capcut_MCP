[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "capcut-mcp"
version = "0.1.0"
description = "Servidor MCP para operar CapCut desde Claude: borradores, cortes automáticos, mejora de audio, subtítulos, assets y workspace organizado."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.9",
  "httpx>=0.27",
  "pillow>=10.0",
]

[project.optional-dependencies]
# Transcripción local (subtítulos automáticos, eliminación de muletillas)
transcribe = ["faster-whisper>=1.0"]
# Descarga de vídeos desde páginas (YouTube, TikTok, etc.) y SVG -> PNG
extras = ["yt-dlp>=2024.1.1", "cairosvg>=2.7"]
all = ["faster-whisper>=1.0", "yt-dlp>=2024.1.1", "cairosvg>=2.7"]
dev = ["pytest>=8"]

[project.scripts]
capcut-mcp = "capcut_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capcut_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
